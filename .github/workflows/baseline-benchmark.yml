name: Baseline Benchmark (No Cache)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake gfortran libopenblas-dev pkg-config

      - name: Build risingwave_common
        run: time cargo build --release -p risingwave_common
